<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星坠规则书</title>
<style>
  :root {
    --sidebar-bg: #f7f8fa;
    --border: #e5e7eb;
    --text: #1f2329;
    --text-dim: #6b7280;
    --hover: #eef0f3;
    --active-bg: #e7effe;
    --active-text: #1d5fd6;
    --guide: #e2e4e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; height: 100vh; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text); background: #fff;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 300px; min-width: 300px; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
  }
  #brand {
    padding: 20px 20px 12px;
    font-size: 17px; font-weight: 700; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  #brand .star { color: #f0a020; font-size: 19px; }
  #search {
    margin: 0 16px 12px; padding: 7px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus { border-color: var(--active-text); box-shadow: 0 0 0 3px rgba(29,95,214,.12); }
  #tree { flex: 1; overflow-y: auto; padding: 0 10px 24px; }
  #tree::-webkit-scrollbar { width: 6px; }
  #tree::-webkit-scrollbar-thumb { background: #d2d5da; border-radius: 3px; }

  .tree ul { list-style: none; margin: 0; padding-left: 14px; position: relative; }
  .tree > ul { padding-left: 4px; }
  .tree ul ul::before {
    content: ""; position: absolute; left: 7px; top: 0; bottom: 6px;
    width: 1px; background: var(--guide);
  }
  .tree li { margin: 1px 0; }

  .tree .label, .tree .file {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; border-radius: 6px;
    font-size: 13.5px; cursor: pointer; user-select: none;
    color: var(--text-dim); transition: background .12s, color .12s;
  }
  .tree .label { font-weight: 600; color: #3c4048; }
  .tree .label:hover, .tree .file:hover { background: var(--hover); color: var(--text); }

  .tree .caret {
    width: 14px; flex: none; text-align: center;
    font-size: 10px; color: #9aa0a8;
    transition: transform .15s;
  }
  .tree .folder > .label .caret::before { content: "▶"; }
  .tree .folder.open > .label .caret { transform: rotate(90deg); }
  .tree .icon { flex: none; font-size: 13px; opacity: .85; }

  .tree .folder > ul {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .18s ease;
  }
  .tree .folder > ul > .inner { overflow: hidden; }
  .tree .folder.open > ul { grid-template-rows: 1fr; }

  .tree .file.active {
    background: var(--active-bg); color: var(--active-text); font-weight: 600;
  }
  .tree .hidden { display: none !important; }
  .no-result { padding: 12px; font-size: 13px; color: var(--text-dim); }

  /* ---------- Content ---------- */
  #content { flex: 1; height: 100vh; overflow-y: auto; }
  #article {
    max-width: 820px; margin: 0 auto;
    padding: 44px 48px 96px; line-height: 1.8; font-size: 15px;
  }
  #article h1 { font-size: 26px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  #article h2 { font-size: 20px; margin-top: 36px; }
  #article h3 { font-size: 16.5px; margin-top: 28px; }
  #article table { border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  #article th, #article td { border: 1px solid #ddd; padding: 6px 12px; }
  #article th { background: #f5f6f8; }
  #article code { background: #f2f3f5; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  #article pre code { display: block; padding: 14px; overflow-x: auto; }
  #article blockquote {
    margin: 16px 0; padding: 4px 16px;
    border-left: 3px solid var(--active-text); background: #f8faff; color: #444;
  }
  .empty-hint { color: var(--text-dim); margin-top: 80px; text-align: center; }

  #topbar, #backdrop { display: none; }

  @media (max-width: 760px) {
    html, body { height: auto; overflow: visible; }
    body { display: block; }
    #topbar {
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 20;
      padding: 10px 16px; background: #fff;
      border-bottom: 1px solid var(--border);
      font-weight: 700; font-size: 15px;
    }
    #menu-btn {
      border: 1px solid var(--border); border-radius: 6px;
      background: #fff; font-size: 16px; padding: 4px 10px; cursor: pointer;
    }
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 30;
      width: 82vw; max-width: 320px; min-width: 0;
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: 2px 0 16px rgba(0,0,0,.15);
    }
    #sidebar.open { transform: translateX(0); }
    #backdrop {
      display: block;
      position: fixed; inset: 0; z-index: 25;
      background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    #backdrop.show { opacity: 1; pointer-events: auto; }
    #content { height: auto; overflow: visible; }
    #article { padding: 20px 18px 64px; font-size: 14.5px; }
    #article table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="topbar"><button id="menu-btn" aria-label="目录">☰</button>星坠规则书</div>
<div id="backdrop"></div>
<nav id="sidebar">
  <div id="brand"><span class="star">✦</span>星坠规则书</div>
  <input id="search" type="search" placeholder="搜索文档…">
  <div id="tree" class="tree"></div>
</nav>
<main id="content"><article id="article"><p class="empty-hint">从左侧目录选择一篇文档</p></article></main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
